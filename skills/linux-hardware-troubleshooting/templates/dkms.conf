# DKMS registration for an out-of-tree kernel module. Copy to the module
# source root, replace <module>/<version>, then:
#   sudo mkdir -p /usr/src/<module>-<version>
#   sudo cp -r Makefile src dkms.conf /usr/src/<module>-<version>/
#   sudo dkms add <module>/<version>
#   sudo dkms build <module>/<version> -k $(uname -r)
#   sudo dkms install <module>/<version> -k $(uname -r)
PACKAGE_NAME="<module>"
PACKAGE_VERSION="<version>"

# KVER override matters: the module's Makefile must accept it so DKMS builds
# against the TARGET kernel, not the running one.
MAKE[0]="make KVER=${kernelver}"
CLEAN="make clean"

BUILT_MODULE_NAME[0]="<module>"
BUILT_MODULE_LOCATION[0]="src"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86"

# Without AUTOINSTALL, plus /etc/kernel/postinst.d/dkms existing, the fix dies
# at the next kernel update - the exact bug this procedure exists to prevent.
AUTOINSTALL="yes"
