name: skills-audit

on:
  push:
    paths:
      - "skills/**"
      - "scripts/audit_skills.py"
  pull_request:
    paths:
      - "skills/**"
      - "scripts/audit_skills.py"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit skills (frontmatter, duplicates, secrets)
        run: python3 scripts/audit_skills.py
