name: public-quality

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "config.yaml.template"
      - ".env.example"
      - "LICENSE"
      - "META_PROMPT.md"
      - "SECURITY.md"
      - "package*.json"
      - "src/**"
      - "tests/**"
      - "index.html"
      - "vite.config.*"
      - "docs/**"
      - "scripts/**"
      - "skills/**"
      - "README.md"
      - "SETUP.md"
      - "SKILLS_CATALOG.md"
      - "INTEGRATION.md"
      - ".github/workflows/public-quality.yml"
  pull_request:
    paths:
      - "config.yaml.template"
      - ".env.example"
      - "LICENSE"
      - "META_PROMPT.md"
      - "SECURITY.md"
      - "package*.json"
      - "src/**"
      - "tests/**"
      - "index.html"
      - "vite.config.*"
      - "docs/**"
      - "scripts/**"
      - "skills/**"
      - "README.md"
      - "SETUP.md"
      - "SKILLS_CATALOG.md"
      - "INTEGRATION.md"
      - ".github/workflows/public-quality.yml"

permissions:
  contents: read

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --no-input pyyaml pytest
      - name: Validate repository configuration and public surface
        run: python scripts/validate_repo.py
      - name: Audit skill frontmatter and secrets
        run: python scripts/audit_skills.py
      - name: Scan public text files for credential-shaped values
        run: python scripts/audit_public_secrets.py
      - name: Test repository validators
        run: python -m pytest tests/test_public_validation.py -q
      - name: Build drift checker
        run: python -m py_compile scripts/repo_drift.py
      - name: Validate workflow YAML
        run: python -c "import pathlib,yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.github/workflows').glob('*.y*ml')]"
      - name: Validate frontend build
        run: |
          npm ci
          npm run lint
          npm run lint:skills
          npm run build
      - name: Check generated files are current
        run: |
          git diff --exit-code -- docs package-lock.json package.json vite.config.* index.html
          if git ls-files --others --exclude-standard docs | grep -q .; then
            echo "Untracked generated files found under docs"
            git ls-files --others --exclude-standard docs
            exit 1
          fi
